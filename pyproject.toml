[project]
name = "prosware"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "azure-ai-ml>=1.34.0",
    "azure-identity>=1.17.0",
    "azureml-mlflow>=1.62.0.post3",
    "mlflow<2.19",
    "mltable>=1.6.3",
    "numpy>=2.4.6",
    "pandas>=2.3.3",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/"]
